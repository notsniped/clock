<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>Retro Clock</title>
<link href="resources/icon-192.png" rel="icon" type="image/png">
<link href="resources/icon-192.png" rel="apple-touch-icon" type="image/png">
<link rel="preload" href="resources/ShareTechMono-Regular.ttf" as="font" type="font/ttf" crossorigin="anonymous">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="clock">
    <div class="time-container">
      <div class="time" id="time"></div>
      <div class="ampm-container">
        <div id="am" class="ampm">AM</div>
        <div id="pm" class="ampm">PM</div>
      </div>
    </div>
    <div class="date" id="date"></div>

    <div class="day-bar" id="dayBar">
      <div class="day"><span>Sun</span><div class="dot"></div></div>
      <div class="day"><span>Mon</span><div class="dot"></div></div>
      <div class="day"><span>Tue</span><div class="dot"></div></div>
      <div class="day"><span>Wed</span><div class="dot"></div></div>
      <div class="day"><span>Thu</span><div class="dot"></div></div>
      <div class="day"><span>Fri</span><div class="dot"></div></div>
      <div class="day"><span>Sat</span><div class="dot"></div></div>
    </div>
  </div>

  <!-- Settings Button -->
  <button class="settings-btn" id="settingsBtn" title="Settings">
    <svg viewBox="0 0 24 24" width="24" height="24">
      <circle cx="12" cy="12" r="2" fill="currentColor"/>
      <path d="M12 1v6m0 10v6M4.22 4.22l4.24 4.24m5.08 5.08l4.24 4.24M1 12h6m10 0h6m-16.78 7.78l4.24-4.24m5.08-5.08l4.24-4.24" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
    </svg>
  </button>

  <!-- Settings Modal -->
  <div class="settings-modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Settings</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-group">
          <label>Color Theme</label>
          <div class="color-options">
            <button class="color-btn" data-color="green" title="Green">●</button>
            <button class="color-btn" data-color="red" title="Red">●</button>
            <button class="color-btn" data-color="blue" title="Blue">●</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');
    const body = document.body;
    const dayBar = document.getElementById('dayBar').children;
    const amEl = document.getElementById('am');
    const pmEl = document.getElementById('pm');
    let colonVisible = true;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
      .then(() => console.log('Service Worker Registered'))
      .catch(err => console.error('Service Worker registration failed:', err));
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const isPM = hours >= 12;
      hours = hours % 12 || 12;

      // Blink the colon
      const colon = `<span class="colon" style="opacity:${colonVisible ? 1 : 0}">:</span>`;
      colonVisible = !colonVisible;

      const timeStr = `${hours.toString().padStart(2, '0')}${colon}${minutes}`;
      timeEl.innerHTML = timeStr;

      const dateOptions = { year: 'numeric', month: 'long', day: 'numeric' };
      dateEl.textContent = now.toLocaleDateString(undefined, dateOptions);

      amEl.classList.toggle('active', !isPM);
      pmEl.classList.toggle('active', isPM);

      const today = now.getDay();
      [...dayBar].forEach((d, i) => d.classList.toggle('active-day', i === today));
    }

    setInterval(updateClock, 1000);
    updateClock();

    let cursorTimeout;
    function hideCursor() {
      body.classList.add('hide-cursor');
    }
    function showCursor() {
      body.classList.remove('hide-cursor');
      clearTimeout(cursorTimeout);
      cursorTimeout = setTimeout(hideCursor, 3000);
    }
    document.addEventListener('mousemove', showCursor);
    cursorTimeout = setTimeout(hideCursor, 3000);

    // Settings modal functionality
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const modalClose = document.getElementById('modalClose');
    const colorBtns = document.querySelectorAll('.color-btn');

    // Load saved color preference or default to green
    const savedColor = localStorage.getItem('clockColor') || 'green';
    applyColor(savedColor);
    updateColorBtnState(savedColor);

    settingsBtn.addEventListener('click', () => {
      settingsModal.classList.add('active');
    });

    modalClose.addEventListener('click', () => {
      settingsModal.classList.remove('active');
    });

    settingsModal.addEventListener('click', (e) => {
      if (e.target === settingsModal) {
        settingsModal.classList.remove('active');
      }
    });

    colorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const color = btn.dataset.color;
        applyColor(color);
        localStorage.setItem('clockColor', color);
        updateColorBtnState(color);
      });
    });

    function applyColor(color) {
      const colors = {
        green: { glow: '#00ff7f', rgb: '0, 255, 127' },
        red: { glow: '#ff0055', rgb: '255, 0, 85' },
        blue: { glow: '#00aaff', rgb: '0, 170, 255' }
      };
      const selectedColor = colors[color];
      document.documentElement.style.setProperty('--clock-glow', selectedColor.glow);
      document.documentElement.style.setProperty('--text-dark', selectedColor.glow);
      document.documentElement.style.setProperty('--glow-rgb', selectedColor.rgb);
    }

    function updateColorBtnState(color) {
      colorBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.color === color);
      });
    }
  </script>
</body>
</html>
